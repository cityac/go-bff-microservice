deploy_dev:
  stage: deploy
  script:
    - helm upgrade -i --set tag=${CI_COMMIT_SHA} --set appEnv='dev' --kube-context gke_dev-web-174812_europe-west1-c_sms-HIDDEN-dev --namespace=dev --wait --timeout 240s --debug bff app-bff
  tags:
    - shell-builder
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

deploy_stage:
  stage: deploy
  script:
    - helm upgrade -i --set tag=${CI_COMMIT_SHA} --set appEnv='stage' --kube-context gke_web-sites-1200_europe-west1-c_sms-HIDDEN-stage --namespace=stage --wait --timeout 240s --debug bff app-bff
  tags:
