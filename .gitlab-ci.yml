stages:
  - build
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: 1
#
.k8s_login:
  - cat ${SERVICE_ACCOUNT} > key.json
  - gcloud auth activate-service-account --key-file=key.json
  - gcloud container clusters get-credentials ${CLUSTER} --zone ${ZONE} --project ${PROJECT}

.helm_install:
  - apt-get update && apt-get install gpg curl apt-transport-https --yes
  - curl https://baltocdn.com/helm/signing.asc | gpg --dearmor | tee /usr/share/keyrings/helm.gpg > /dev/null
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/helm.gpg] https://baltocdn.com/helm/stable/debian/ all main" | tee /etc/apt/sources.list.d/helm-stable-debian.list
  - apt-get update && apt-get install helm -y

build_dev:
  stage: build
  variables:
    buildenv: dev
  script:
    - docker build --build-arg CI_JOB_TOKEN=${CI_JOB_TOKEN} --build-arg buildenv=${buildenv} -t ${CI_REGISTRY_IMAGE}/releases:dev-${CI_COMMIT_SHA} -f docker/Dockerfile --compress .
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker push ${CI_REGISTRY_IMAGE}/releases:dev-${CI_COMMIT_SHA}
  tags:
    - shell-builder
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

build_stage:
  stage: build
  variables:
    buildenv: stage
  script:
    - docker build --build-arg CI_JOB_TOKEN=${CI_JOB_TOKEN} --build-arg buildenv=${buildenv} -t ${CI_REGISTRY_IMAGE}/releases:stage-${CI_COMMIT_SHA} -f docker/Dockerfile --compress .
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker push ${CI_REGISTRY_IMAGE}/releases:stage-${CI_COMMIT_SHA}
  tags:
    - shell-builder
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"


build_prod-enterprise:
  stage: build
  variables:
    buildenv: prod-enterprise
  script:
    - docker build --build-arg CI_JOB_TOKEN=${CI_JOB_TOKEN} --build-arg buildenv=${buildenv} -t ${CI_REGISTRY_IMAGE}/releases:prod-enterprise-${CI_COMMIT_SHA} -f docker/Dockerfile --compress .
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker push ${CI_REGISTRY_IMAGE}/releases:prod-enterprise-${CI_COMMIT_SHA}
  tags:
    - shell-builder
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual

build_prod-HIDDEN:
  stage: build
  variables:
    buildenv: prod-HIDDEN
  script:
    - docker build --build-arg CI_JOB_TOKEN=${CI_JOB_TOKEN} --build-arg buildenv=${buildenv} -t ${CI_REGISTRY_IMAGE}/releases:prod-HIDDEN-${CI_COMMIT_SHA} -f docker/Dockerfile --compress .
