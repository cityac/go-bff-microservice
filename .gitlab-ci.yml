    - docker push ${CI_REGISTRY_IMAGE}/releases:prod-HIDDEN-${CI_COMMIT_SHA}
  tags:
    - shell-builder
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual

