deploy_prod_HIDDEN:
  variables:
    CLUSTER: sms-HIDDEN
    ZONE: europe-west1-b
    PROJECT: HIDDEN-proj
  stage: deploy
  image: google/cloud-sdk
  before_script:
    - !reference [.k8s_login]
    - !reference [.helm_install]
