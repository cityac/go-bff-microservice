deploy_prod_enterprise:
  stage: deploy
  script:
    - helm upgrade -i --set tag=${CI_COMMIT_SHA} --set appEnv='prod-enterprise' --kube-context gke_web-sites-1200_europe-west1-b_sms-HIDDEN-prod --namespace=enterprise --wait --timeout 240s --debug bff app-bff
  tags:
    - shell-builder
  rules:
    - if: $CI_COMMIT_TAG
      when: manual

